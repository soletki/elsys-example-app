name: CI/CD Pipeline

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main

jobs:
  # ===============================
  # 🧹 Linting (Flake8)
  # ===============================
  lint:
    name: Lint Code (Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  # ===============================
  # 🚦 Continuous Integration (Tests)
  # ===============================
  ci:
    name: Run Tests (Pytest + Locust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx locust python-multipart

      - name: Run unit tests
        run: pytest -v

      - name: Start FastAPI app in background
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run short load test with Locust
        run: |
          locust -f tests/locustfile.py \
            --headless \
            -u 10 \
            -r 5 \
            -t 30s \
            --host http://127.0.0.1:8000

  # ===============================
  # 🚀 Continuous Deployment (main)
  # ===============================
  cd:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, ci]   # ✅ deploy only if lint + tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}:latest
          SHA_TAG=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker build -t $IMAGE_NAME -t $SHA_TAG .
          docker push $IMAGE_NAME
          docker push $SHA_TAG
